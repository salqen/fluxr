# OpenLiteSpeed — reverse proxy na fluxr (gunicorn na 127.0.0.1:5000).
# Pridať na koniec /usr/local/lsws/conf/vhosts/<domena>/vhost.conf a
# spraviť graceful restart: /usr/local/lsws/bin/lswsctrl restart
extprocessor fluxr {
  type                    proxy
  address                 127.0.0.1:5000
  maxConns                100
  pcKeepAliveTimeout      60
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 fluxr
  addDefaultCharset       off
}
